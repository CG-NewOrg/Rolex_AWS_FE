_schema-version: "3.2"
ID: AICockpit
version: 0.0.1
modules:
  - name: AICockpit-destination-content
    type: com.sap.application.content
    requires:
      - name: AICockpit-destination-service
        parameters:
          content-target: true
      - name: AICockpit_html_repo_host
        parameters:
          service-key:
            name: AICockpit_html_repo_host-key
      - name: uaa_AICockpit
        parameters:
          service-key:
            name: uaa_AICockpit-key
    parameters:
      content:
        instance:
          destinations:
            - Name: AICockpit_html_repo_host
              ServiceInstanceName: AICockpit-html5-app-host-service
              ServiceKeyName: AICockpit_html_repo_host-key
              sap.cloud.service: aiCockpitQ
            - Authentication: OAuth2UserTokenExchange
              Name: aiCockpit_uaa_AICockpit
              ServiceInstanceName: AICockpit-xsuaa-service
              ServiceKeyName: uaa_AICockpit-key
              sap.cloud.service: aiCockpitQ
          existing_destinations_policy: update
    build-parameters:
      no-source: true

  - name: AICockpit-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: AICockpit_html_repo_host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - cockpitai.zip
          name: cockpitai
          target-path: resources/

  - name: cockpitai
    type: html5
    path: cockpitai
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

resources:
 
  - name: uaa_AICockpit
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
      service-name: AICockpit-xsuaa-service

  - name: AICockpit_html_repo_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: AICockpit-html5-app-host-service
      service-plan: app-host

  - name: AICockpit-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: AICockpit-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-name: AICockpit-destination-service
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Name: ui5
                Type: HTTP
                ProxyType: Internet
                URL: https://ui5.sap.com
                Authentication: NoAuthentication
            existing_destinations_policy: update
        version: 1.0.0

